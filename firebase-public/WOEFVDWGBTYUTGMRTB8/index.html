<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DECODED TRANSMISSION</title>
  <style>
    :root {
      --cyan: #00f3ff;
      --magenta: #ff00ea;
      --blue: #0044ff;
      --glass-bg: rgba(10, 15, 30, 0.45);
      --glass-border: rgba(0, 243, 255, 0.3);
      --glow: 0 0 20px rgba(0, 243, 255, 0.5);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050810;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* Single Seamless Background with Cinematic Drift */
    .space-scene {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      background-image: url('/assets/scene.webp');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      animation: cinematic-drift 40s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes cinematic-drift {
      0% { 
        transform: scale(1) translate(0, 0) rotate(0deg); 
        filter: hue-rotate(0deg) brightness(1); 
      }
      50% { 
        filter: hue-rotate(15deg) brightness(1.15); 
      }
      100% { 
        transform: scale(1.08) translate(-2%, -2%) rotate(1deg); 
        filter: hue-rotate(-10deg) brightness(0.9); 
      }
    }

    /* CSS-only Light Blooms & Lens Flares */
    .css-blooms {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.3), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 0, 234, 0.25), transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0, 68, 255, 0.2), transparent 60%);
      mix-blend-mode: screen;
      animation: bloom-pulse 15s ease-in-out infinite alternate;
    }

    @keyframes bloom-pulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .css-lens-flare {
      position: absolute;
      top: 40%; left: -20%;
      width: 140%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.8), rgba(255, 255, 255, 1), rgba(255, 0, 234, 0.8), transparent);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.6), 0 0 40px rgba(255, 0, 234, 0.4);
      transform: rotate(-15deg);
      opacity: 0.5;
      mix-blend-mode: screen;
      z-index: 2;
      animation: flare-sweep 12s linear infinite;
    }

    @keyframes flare-sweep {
      0% { transform: rotate(-15deg) translateY(-30vh) scaleX(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: rotate(-15deg) translateY(30vh) scaleX(1.5); opacity: 0; }
    }

    /* CSS Scanlines */
    .css-scanlines {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      animation: scanline-shift 10s linear infinite;
    }

    @keyframes scanline-shift {
      0% { background-position: 0 0; }
      100% { background-position: 0 100vh; }
    }

    /* CSS Floating Particles */
    .css-particles {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 
        10vw 20vh 2px #fff, 30vw 80vh 3px var(--cyan), 80vw 10vh 2px var(--magenta), 
        90vw 90vh 1px #fff, 50vw 50vh 3px var(--cyan), 20vw 40vh 2px #fff, 
        60vw 15vh 4px var(--blue), 70vw 70vh 2px var(--magenta), 40vw 90vh 1px #fff;
      animation: float-up 20s linear infinite;
      z-index: 2;
      opacity: 0;
    }

    @keyframes float-up {
      0% { transform: translateY(5vh); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(-25vh); opacity: 0; }
    }

    /* UI Layer */
    .ui-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }

    .ui-container.fading-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 60px 40px;
      text-align: center;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2), inset 0 0 30px rgba(0,243,255,0.1);
      position: relative;
      overflow: hidden;
      min-height: 280px;
    }

    .glass-panel::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
      transform: skewX(-25deg);
      animation: glass-shine 6s infinite;
    }

    @keyframes glass-shine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    .glitch-title {
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
      color: #fff;
      text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--blue);
      line-height: 1.2;
    }

    .subtext {
      font-size: clamp(14px, 2vw, 18px);
      color: #a0b4d0;
      letter-spacing: 1px;
      margin-bottom: 50px;
      font-weight: 300;
      line-height: 1.4;
    }

    /* Premium Holographic Portal Button */
    .holo-btn {
      position: relative;
      background: rgba(5, 10, 20, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: none;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 450px;
      height: 85px;
      box-shadow: 
        0 0 25px rgba(0, 243, 255, 0.25), 
        inset 0 0 20px rgba(0, 243, 255, 0.3),
        inset 0 0 40px rgba(255, 0, 234, 0.15);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
      z-index: 10;
    }

    /* Animated gradient border wrapper */
    .holo-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 6px;
      padding: 2px;
      background: linear-gradient(45deg, var(--cyan), transparent, var(--magenta), transparent, var(--blue));
      background-size: 200% 200%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: border-flow 4s linear infinite;
    }

    @keyframes border-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Internal glowing scanline sweep for the button */
    .holo-btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(
        transparent, 
        rgba(0, 243, 255, 0.1) 40%, 
        rgba(255, 255, 255, 0.6) 50%, 
        rgba(255, 0, 234, 0.1) 60%, 
        transparent
      );
      transform: rotate(30deg) translateY(-100%);
      animation: btn-sweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    @keyframes btn-sweep {
      0% { transform: rotate(30deg) translateY(-100%); }
      20%, 100% { transform: rotate(30deg) translateY(100%); }
    }

    .holo-btn:hover {
      transform: scale(1.04);
      box-shadow: 
        0 0 40px rgba(0, 243, 255, 0.5), 
        0 0 70px rgba(255, 0, 234, 0.3),
        inset 0 0 40px rgba(0, 243, 255, 0.5);
      background: rgba(10, 20, 35, 0.8);
    }

    .holo-btn:active {
      transform: scale(0.98);
    }

    .btn-text {
      position: relative;
      z-index: 2;
      font-size: clamp(16px, 2.5vw, 20px);
      font-weight: 800;
      color: #fff;
      letter-spacing: 4px;
      text-shadow: 0 0 12px var(--cyan), 0 0 24px var(--magenta);
    }

    .retry-btn {
      margin-top: 20px;
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid rgba(255, 0, 85, 0.5);
      color: #fff;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      display: none;
    }

    .retry-btn:hover {
      background: rgba(255, 0, 85, 0.4);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
    }

    /* Video Layer & Loading State */
    .video-container {
      position: absolute;
      inset: 0;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .loading-state {
      position: absolute;
      z-index: 21;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .loading-state.visible { opacity: 1; }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 243, 255, 0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .loading-text {
      color: var(--cyan);
      font-size: 14px;
      letter-spacing: 4px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    #media-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      opacity: 0;
      transition: opacity 0.5s ease;
      &::-webkit-media-controls { display: none !important; }
      &::-webkit-media-controls-enclosure { display: none !important; }
    }
    #media-player.ready { opacity: 1; }

    .cinematic-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, transparent, rgba(0,0,0,0.8));
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease;
      z-index: 22;
    }

    .cinematic-overlay.visible {
      opacity: 1;
    }

    .overlay-title {
      font-size: clamp(40px, 8vw, 80px);
      font-weight: 300;
      color: #fff;
      letter-spacing: 8px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(255,255,255,0.5);
      line-height: 1.1;
    }

    .overlay-subtext {
      font-size: clamp(16px, 3vw, 24px);
      color: #aaa;
      letter-spacing: 2px;
      font-weight: 300;
      line-height: 1.3;
    }

    .mute-control {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      z-index: 23;
    }

    .video-container.active .mute-control {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 1.5s;
    }

    .mute-control:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .mute-control svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    @media (prefers-reduced-motion: reduce) {
      .space-scene, .css-blooms, .css-lens-flare, .css-scanlines, .css-particles {
        animation: none !important;
      }
      .holo-btn::before, .holo-btn::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="space-scene"></div>
  <div class="css-blooms"></div>
  <div class="css-lens-flare"></div>
  <div class="css-scanlines"></div>
  <div class="css-particles"></div>
  <div class="css-particles" style="animation-delay: -5s; animation-duration: 25s; left: 10vw;"></div>
  <div class="css-particles" style="animation-delay: -12s; animation-duration: 18s; left: -20vw;"></div>

  <main id="ui-layer" class="ui-container">
    <div class="glass-panel">
      <h1 class="glitch-title">SIGNAL SUCCESSFULLY RECONSTRUCTED</h1>
      <p class="subtext">A complete transmission has been recovered from the noise.</p>
      
      <button id="trigger-btn" class="holo-btn">
        <span class="btn-text">OPEN DECODED TRANSMISSION</span>
      </button>
      
      <button id="retry-btn" class="retry-btn">RECONNECT SIGNAL</button>
    </div>
  </main>

  <div id="video-layer" class="video-container">
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">ESTABLISHING UPLINK...</div>
    </div>

    <!-- Preload none prevents large initial payload -->
    <video id="media-player" playsinline preload="none" disablePictureInPicture disableRemotePlayback>
      <source src="/assets/dont-give-up-yet.mp4" type="video/mp4">
    </video>
    
    <div id="video-overlay" class="cinematic-overlay">
      <h2 class="overlay-title">Good try.</h2>
      <p class="overlay-subtext">The signal was never the answer.</p>
    </div>
    
    <button id="mute-btn" class="mute-control">
      <svg id="icon-unmute" style="display: none;" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg id="icon-mute" viewBox="0 0 24 24">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>
  </div>

  <script>
    const uiLayer = document.getElementById('ui-layer');
    const videoLayer = document.getElementById('video-layer');
    const loadingState = document.getElementById('loading-state');
    const triggerBtn = document.getElementById('trigger-btn');
    const retryBtn = document.getElementById('retry-btn');
    const video = document.getElementById('media-player');
    const videoOverlay = document.getElementById('video-overlay');
    const muteBtn = document.getElementById('mute-btn');
    const iconUnmute = document.getElementById('icon-unmute');
    const iconMute = document.getElementById('icon-mute');

    // Fetch video purely on intent
    const startPreload = () => {
      if (video.preload === 'none') {
        video.preload = 'auto';
        video.load(); 
      }
    };
    
    triggerBtn.addEventListener('mouseenter', startPreload, { once: true });
    triggerBtn.addEventListener('touchstart', startPreload, { once: true, passive: true });

    video.addEventListener('contextmenu', e => e.preventDefault());

    video.addEventListener('playing', () => {
      loadingState.classList.remove('visible');
      video.classList.add('ready');
    });

    const startExperience = async () => {
      startPreload(); 
      retryBtn.style.display = 'none';
      
      uiLayer.classList.add('fading-out');
      videoLayer.classList.add('active');
      loadingState.classList.add('visible');
      
      try {
        video.muted = false;
        await video.play();
        
        setTimeout(() => {
          videoOverlay.classList.add('visible');
          setTimeout(() => {
            videoOverlay.classList.remove('visible');
          }, 4000);
        }, 800);
        
        updateMuteIcon();
      } catch (err) {
        console.error("Playback failed", err);
        loadingState.classList.remove('visible');
        retryBtn.style.display = 'inline-block';
      }
    };

    triggerBtn.addEventListener('click', startExperience);
    retryBtn.addEventListener('click', startExperience);

    const updateMuteIcon = () => {
      if (video.muted) {
        iconMute.style.display = 'block';
        iconUnmute.style.display = 'none';
      } else {
        iconMute.style.display = 'none';
        iconUnmute.style.display = 'block';
      }
    };

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      updateMuteIcon();
    });
  </script>
</body>
</html>
