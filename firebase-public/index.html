<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Nothing to see here</title>
    <link rel="stylesheet" href="/styles-v5.css" />
  </head>
  <body>
    <main class="suspiciously-empty-div" aria-label="Totally normal empty space">
      <span id="tax-document" class="tax-document">&nbsp;</span>
      <section class="definitely-not-a-puzzle" aria-label="Void projection surface">
        <picture>
          <source
            media="(min-aspect-ratio: 4/3)"
            srcset="/puzzle-bg-desktop-v5.png"
          />
          <img
            class="normal-background"
            src="/puzzle-bg-v5.png"
            alt="Just a boring dark background"
            draggable="false"
          />
        </picture>
        <div class="decorative-dust" aria-label="Decorative dust particles"></div>
      </section>
    </main>
    <script src="/app-v5.js" defer></script>
  </body>
</html>
